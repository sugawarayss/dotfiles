[env]
MISE_BREW_CASK_OPT_APPDIR = "$HOME/Applications"

[tools]
# Languages
bun = "latest"
deno = "latest"
dotnet = "latest"
elixir = "latest"
erlang = "latest"
flutter = "latest"
go = "latest"
java = "21"
julia = "latest"
node = "latest"
perl = "latest"
python = "latest"
ruby = "latest"
rust = "latest"
scala = "latest"
zig = "latest"
# GitHub Actions用linter
actionlint = "latest"
ghalint = "latest"
zizmor = "latest"
# CLI tools
act = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
aws-vault = "latest"
# azure-cli の依存 pymsalruntime に cp315 wheel が無いため python を固定（mise は既定でグローバル python=latest を渡す）
azure = { version = "latest", uvx_args = "--python 3.14" }
bat = "latest"
betterleaks = "latest"
biome = "latest"
bottom = "latest"
claude = "latest"
claude-powerline = "latest"
delta = "latest"
dive = "latest"
# aqua registry は rosetta2: true で Apple Silicon でも x86_64 版を入れるため、github backend で arm64 版を入れる
"github:dotenv-linter/dotenv-linter" = "latest"
dotenvx = "latest"
dust = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
github-cli = "latest"
ghq = "latest"
gping = "latest"
hadolint = "latest"
hub = "latest"
hunk = "latest"
jq = "latest"
jujutsu = "latest"
just = "latest"
lazydocker = "latest"
lazygit = "latest"
lazyssh = "latest"
# lsd = "latest"
lychee = "latest"
markdownlint-cli2 = "latest"
# 依存 onnxruntime(magika経由) に cp315 wheel が無いため python を固定
"pipx:markitdown" = { version = "latest", extras = "all", uvx_args = "--python 3.14" }
marp-cli = "latest"
nono = "latest"
pandoc = "latest"
# pdm = "latest"
# peco = "latest"
pinact = "latest"
pnpm = "latest"
# poetry = "latest"
qsv = "latest"
ripgrep = "latest"
ripgrep-all = "latest"
sd = "latest"
semgrep = "latest"
starship = "latest"
task = "latest"
# terraform = "latest"
tirith = "latest"
tokei = { version = "latest", backend = "cargo" }
tombi = "latest"
usage = "latest"
uv = "latest"
websocat = "latest"
yarn = "latest"
yazi = "latest"
yq = "latest"
zoxide = "latest"
"github:agavra/tuicr" = "latest"
"npm:@playwright/cli" = "latest"
codex = "latest"
antigravity-cli = "latest"
"npm:@apify/mcpc" = "latest"
"npm:@trailhq/trail-code" = "latest"
"npm:deepsec" = "latest"
"npm:impeccable" = "latest"

[settings]
# .python-versionファイルを使用してPythonのバージョンを管理する場合、miseもそれに従う
# ./mise.toml -> ./.python-version → $HOME/.config/mise/config.toml の優先順位
# idiomatic_version_file_enable_tools = ["python"]
# サプライチェーン攻撃リスクを低減するため、パッケージ公開から3日以上経過しているもののみインストールする
minimum_release_age = "3d"
experimental = true

[settings.self_update]
auto = true
