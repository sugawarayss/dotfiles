# gwm ユーザーレベルグローバル設定
# 配置先: ~/.config/gwm/config.toml ($XDG_CONFIG_HOME/gwm/config.toml)
#
# マージ規則（リポジトリ側の .gwm.toml が優先）:
#   - スカラー値: リポジトリ設定が全体設定を上書き
#   - テーブル  : キーごとに再帰的にマージ
#   - 配列     : リポジトリ側に存在すれば全体設定を置換
#
# 全体設定を無視したい場合は環境変数 GWM_NO_GLOBAL_CONFIG=1 を設定する。
#
# 未知のトップレベルキー/列挙値はロード時エラーになるため、
# 使わないセクションはコメントのまま残しておくこと。

# ── [worktree]: ワークツリーのパス・ブランチ命名規則 ──────────────
# プレースホルダー: {home} {repo} {type} {issue} {desc} {repo_path} {repo_parent}
[worktree]
base = "{repo_parent}/worktrees"
# path_pattern = "{type}-{issue}-{desc}"
# branch_pattern = "{type}/#{issue}-{desc}"

# ── [[bootstrap.copy]]: メインチェックアウト→ワークツリーへのファイルコピー ──
[[bootstrap.copy]]
# メインチェックアウト上のソースパス
from = ".env.example"
# ワークツリー上の相対パス
to = ".env"
# from が存在しない場合、中止する
required = true
# コピー時に適用するルール名 - [[bootstrap.guard]]で定義
# guards = []
# 失敗時のaction: skip=スキップ, inline=標準出力に表示, abort=中止
fallback = "abort"  # inline | skip | abort

[[bootstrap.copy]]
from = "graft/"
to = "graft/"
required = false
fallback = "skip"

# ── [[bootstrap.guard]]: コピーするファイル内容の正規表現チェックルール ──────
# [[bootstrap.guard]]
# name = "no-secrets"
# deny_patterns = ["SECRET_KEY\\s*=\\s*\\S+"]
# on_match = "abort" # abort | seed-from-example
# example_file = ".env.example"

# ── [[bootstrap.no_symlink]]: シンボリックリンクの継承を拒否 ──────
[[bootstrap.no_symlink]]
path = "node_modules"

[[bootstrap.no_symlink]]
path = ".venv"

# ── [[hooks.*]]: ライフサイクルフック ─────────────────────────
# 種別: pre_create / post_create / pre_bootstrap / post_bootstrap / pre_remove / post_remove
# プレースホルダ: {branch} {path} {type} {issue} {desc} {user} {owner} {repo}
# 条件種別: file_sxists:<パス> / cmd_exists:<名称> / env_set:<名称> / env_eq:<キー>=<値> / glob_exists:<パターン>

# [[hooks.<種別>]]
# name = "hookの名称"
# run = "実行するコマンド(プレースホルダ利用可)"
# when = "<条件種別>:<条件値>"
# on_fail = "warn" # abort | warn | ignore
# [hooks.post_create.env]

# ── [[hooks.post_create]]: プロジェクトセットアップ ─────────────────────────
[[hooks.post_create]]
name = "mise setup"
run = "mise run setup:project"
when = "file_exists:mise.toml"
on_fail = "abort"

[[hooks.post_create]]
name = "uv sync"
run = "uv sync"
when = "file_exists:pyproject.toml"
on_fail = "warn"

# ── [[hooks.post_create]]: herdrワークスペースを開く─────────────────────────
[[hooks.post_create]]
name = "herdr workspace open"
run = '''herdr worktree open --cwd "$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")" --path "$(pwd)" --label "$(git branch --show-current)" --no-focus'''
on_fail = "warn"

# ── [git_tui]: l キーで起動するgitツール ───────────────────────
[git_tui]
command = "lazygit -p {path}"
# fullscreen = true

# ── [review]: レビュー起動コマンド ────────────────────────────
# [review]
# tool = "lumen"
# command = ""
# fullscreen = true
# default_base = ""

# ── [exec]: 並列実行プロファイル ──────────────────────────────
# [exec]
# jobs = 1
# [exec.profiles.test]
# command = ["pnpm", "test"]
# jobs = 2
# [exec.profiles.test.container]
# image = ""
# runtime = "" # auto-detect: docker → podman
# extra_args = []
# selinux_relabel = false

# ── [clean]: クリーン対象ディレクトリプロファイル ───────────────────
# デフォルトプロファイルの対象: target, node_modules, dist, build, coverage, .turbo
# [clean.profiles.default]
# dirs = ["node_modules", "dist", "build", "coverage", ".turbo", "target"]

# ── [tui]: TUIランタイム設定 ──────────────────────────────────
[tui]
sidebar_position = "left"  # right | left
# confirm_countdown_secs = 3   # 削除確認カウントダウン秒数 (0-5)
sidebar_orientation = "side-by-side"  # stacked | side-by-side | auto
layout = "bordered"  # compact | bordered
# dim_unfocused = false
# status_one_line = true
note_vim = true
# mux_open_in = "pane"        # pane | tab | workspace
# mux_pane_direction = "right" # right | down | left | up
terminal_browser = "terminal-browser {url}"
# terminal_browser_open_in = "overlay" # overlay | detached
# clipboard = "auto"          # auto | osc52 | tools
# auto_refresh_secs = 60

# ── [tui.macro1] / [tui.macro2]: ユーザー定義コマンド（h / H キー） ─────
# [tui.macro1]
# command = ""
# open_in = "pty" # pty | mux_pane

# ── [tui.keys]: キーマップ上書き ────────────────────────────────
# 形式: action = ["chord1", "chord2"] (例: "g g", "Ctrl+x", "Space")
# [tui.keys]
# down = ["j", "Down"]
# up = ["k", "Up"]
# top = ["g g"]
# bottom = ["G"]
# focus_swap = ["Tab"]
# create = ["n"]
# delete = ["d"]
# sync = ["s"]
# lazygit_pty = ["l"]
# review_pty = ["r"]
# terminal_pty = ["t"]
# yank_path = ["y p"]
# yank_branch_name = ["y b"]
# yank_worktree_name = ["y n"]
# help = ["?"]
# quit = ["q"]
# command_palette = [":"]

# ── [tui.keys.modal.<context>]: モーダル内キーマップ（単一キーのみ） ────
# context例: confirm, create, help, note
# [tui.keys.modal.confirm]
# accept = "y"
# cancel = "n"

# ── [tui.open]: o キー等でのオープン方法 ─────────────────────────
[tui.open]
mode = "editor"  # shell | editor | finder
# $SHELL をオーバーライド
# shell_cmd = ""
# $EDITOR をオーバーライド
editor_cmd = "nvim"

# ── [tui.agent_resume]: AIエージェントのセッション再開コマンド ─────────
# [tui.agent_resume]
# claude = "claude -r {session}"
# codex = "codex resume {session}"
# opencode = "opencode -s {session}"
# vibe = "vibe --resume {session}"

# ── [theme]: 役割ベースの配色 ────────────────────────────────
# preset: catppuccin | gruvbox | tokyo-night | claude-dark
# 色値形式: 色名(cyan等) | 256パレット番号(0-255) | 16進数(#RRGGBB、#RGB非対応)
[theme]
preset = "tokyo-night"
# focus = "cyan"
# accent = "cyan"
# branch = "green"
# clean = "green"
# dirty = "yellow"
# main = "yellow"
# locked = "magenta"
# prunable = "red"
# muted = "dark_gray"
# selection_bg = "dark_gray"
# name = "white"
# path = "gray"
# staged = "cyan"
# modified = "yellow"
# untracked = "green"
# section_bg = 236

