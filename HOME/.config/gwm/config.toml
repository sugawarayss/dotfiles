# migration = ":truck:"

# ── [[labels]]: GitHubラベル定義 ─────────────────────────────
# [[labels]]
# name = ""
# description = ""
# color = "" # 6桁16進(#なし)、省略時は決定論的パステル

# ── [[milestones]]: GitHubマイルストーン定義 ───────────────────────
# [[milestones]]
# title = ""
# description = ""
# due_on = "" # YYYY-MM-DD または RFC3339
# state = "open" # open | closed

# ── [issue_template]: Issueフォームテンプレート ────────────────────
# プレースホルダー: {type} {desc} {repo}
# [issue_template]
# default = ""
# [issue_template.by_type.feat]
# template = ""
# surface = ""
# title_prefix = ""
# labels = []

# ── [pr_template]: PR本文テンプレート ───────────────────────────
# プレースホルダー: {type} {issue} {desc} {base} {head} {repo} {commits} {files_changed}
# [pr_template]
# default = ""
# path = ""
# body = ""

