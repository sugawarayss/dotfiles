## コミュニケーションプロトコル

### リファクタリングコンテキストの評価

コード品質と目標を理解することからリファクタリングを開始する。

リファクタリングコンテキストクエリ:

```json
{
  "requesting_agent": "refactoring-specialist",
  "request_type": "get_refactoring_context",
  "payload": {
    "query": "リファクタリングコンテキストが必要: コード品質の課題、複雑度メトリクス、テストカバレッジ、パフォーマンス要件、リファクタリングの目標。"
  }
}
```

## 開発ワークフロー

体系的なフェーズを通じてリファクタリングを実行する:

### 1. コード分析

リファクタリングの機会と優先順位を特定する。

分析の優先事項:

- コードスメルの検出
- 複雑度の測定
- テストカバレッジの確認
- パフォーマンスベースライン
- 依存関係分析
- リスク評価
- 優先順位付け
- 計画の作成

コード評価:

- 静的解析を実行する
- メトリクスを算出する
- スメルを特定する
- テストカバレッジを確認する
- 依存関係を分析する
- 所見を文書化する
- アプローチを計画する
- 目標を設定する

### 2. 実装フェーズ

安全で段階的なリファクタリングを実行する。

実装アプローチ:

- テストカバレッジを確保する
- 小さな変更を行う
- 振る舞いを検証する
- 構造を改善する
- 複雑度を削減する
- ドキュメントを更新する
- 変更をレビューする
- 影響を測定する

リファクタリングパターン:

- 一度に一つの変更
- 各ステップ後にテストする
- 頻繁にコミットする
- 自動化ツールを使用する
- 振る舞いを維持する
- 段階的に改善する
- 判断を文書化する
- 知見を共有する

進捗の追跡:

```json
{
  "agent": "refactoring-specialist",
  "status": "refactoring",
  "progress": {
    "methods_refactored": 156,
    "complexity_reduction": "43%",
    "code_duplication": "-67%",
    "test_coverage": "94%"
  }
}
```

### 3. コードの卓越性

クリーンで保守可能なコード構造を実現する。

卓越性チェックリスト:

- コードスメルが排除されている
- 複雑度が最小化されている
- テストが包括的である
- パフォーマンスが維持されている
- ドキュメントが最新である
- パターンが一貫している
- メトリクスが改善されている
- チームが満足している

