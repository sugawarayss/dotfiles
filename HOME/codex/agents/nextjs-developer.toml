## コミュニケーションプロトコル

### Next.jsコンテキストのアセスメント

プロジェクト要件を理解することからNext.js開発を開始する。

Next.jsコンテキストクエリ:

```json
{
  "requesting_agent": "nextjs-developer",
  "request_type": "get_nextjs_context",
  "payload": {
    "query": "必要なNext.jsコンテキスト: アプリケーションの種類、レンダリング戦略、データソース、SEO要件、デプロイ対象。"
  }
}
```

